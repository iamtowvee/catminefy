# enabled - Is the plugin enabled?
# If "true", the plugin is enabled
#
#     [!] If you disable the plugin, its commands will also stop working
#
# Default value: true
enabled: true

# autoCheckUpdates - Automatically check for updates
# If "true", then checks for updates every time the server starts
#
#     [!] It may overload the server with unnecessary requests and may slow down the server loading
#
# Default value: true
autoCheckUpdates: true

# lang - The language in which the plugin messages will be displayed
# Acceptable values:
#   - "en": English
#   - "ru": Russian
#   - "ro": Romana
#   - "de": Deutsch
#   - "it": Italian
#   - "fr": French
#   - "es": Spanish
#
#     [!] Now work only "en" and "ru"
#
# Default value: en
lang: en

# saveDataFormat - Data storage format
# Available: "sqlite" (data.db) or "yaml" (data.yml)
#
#     [!] SQLite is not human-readable; Will be in future versions
#
# Default value: true
saveDataFormat: yaml

# allowedOverCameraBlocks - Whitelist of blocks that can be located above the camera
# If there is a block above the camera that is not in the list, the camera will not open
#
#     [!] If solid block is allowed, then in some cases there may be x-ray to see through blocks
#         If the "Do not render foliage transparency" option (or something similar) is set in the settings,
#         then the block is also considered solid
#
# Default value:
#  - AIR
#  - GLASS
#  - TINTED_GLASS
#  - WHITE_STAINED_GLASS
#  - LIGHT_GRAY_STAINED_GLASS
