# =============== ITEMS ============================= #
# =================================================== #

items:
  camera:
    display: "&e&lCamera"
    lore: ["&7Security camera,", "Minecraft doesn't seem the same anymore..."]
  monitor:
    display: "&b&lMonitor"
    lore: ["&7Monitor for linking cameras,", "can store &e&l7 &7cameras &asimultaneously"]

