# English translations for Cameras Plugin
# Language: English (en)

# =================================================== #
# =============== COMMANDS ========================== #
# =================================================== #

commands:
  help:
    header: "&e&l=== Cameras Plugin Help ==="
    usage: "&7/cameras take <monitor|camera> &f- Get a camera/monitor head"
    reload: "&7/cameras reload &f- Reload the plugin configuration"
    craft: "&7/cameras craft <monitor|camera> &f- View craft"
    version: "&7/cameras version &f- Show plugin version"
    help: "&7/cameras help &f- Show this help"

  take:
    success_monitor: "&aYou received a monitor head!"
    success_camera: "&aYou received a camera head!"
    invalid_type: "&cInvalid type! Use: monitor or camera"
    usage: "&cUsage: /cameras take <monitor|camera>"
    player_only: "&cThis command is for players only!"

  reload:
    success: "&aPlugin configuration reloaded!"
    no_permission: "&cYou don't have permission to do this!"

  version:
    line: "&e&lCameras Plugin &7v%version%"
    author: "&7By %author%"
    github: "&7%github%"

