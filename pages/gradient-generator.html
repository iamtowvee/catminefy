<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catminefy</title>

        <link rel="stylesheet" href="../assets/css/general.css">
        <link rel="stylesheet" href="../assets/css/roots.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Alumni+Sans+SC:ital,wght@0,100..900;1,100..900&family=Bebas+Neue&family=Black+Ops+One&family=Caveat:wght@400..700&family=Comfortaa:wght@300..700&family=Electrolize&family=Exo:ital,wght@0,100..900;1,100..900&family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Permanent+Marker&family=Shadows+Into+Light&family=Share+Tech&family=Six+Caps&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Varela+Round&display=swap" rel="stylesheet">
        
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    </head>
    <body>
        <div class="sidebar">
            <a href="home.html" class="sidebar-item">
                <span class="icon">&#xf46d;</span>
                <span class="label">Главная</span>
                <span class="tooltip">Главная</span>
            </a>
            
            <div class="sidebar-divider"></div>
            
            <a href="#" class="sidebar-item active">
                <span class="icon">&#xf174a;</span>
                <span class="label">Генератор градиентов</span>
                <span class="tooltip">Генератор градиентов</span>
            </a>
            
            <a href="text-customize.html" class="sidebar-item">
                <span class="icon">&#xf0061;</span>
                <span class="label">Кастомизация текста</span>
                <span class="tooltip">Кастомизация текста</span>
            </a>
            
            <div class="sidebar-divider"></div>
            
            <a href="settings.html" class="sidebar-item">
                <span class="icon">&#xf423;</span>
                <span class="label">Настройки</span>
                <span class="tooltip">Настройки</span>
            </a>
            
            <a href="about.html" class="sidebar-item">
                <span class="icon">&#xf420;</span>
                <span class="label">О программе</span>
                <span class="tooltip">О программе</span>
            </a>
        </div>

        <div class="content">
            <section id="top">
                <h1>Генератор градиентов</h1>
            </section>

            <section>
                <!-- Текст -->
                <div class="control-group">
                    <label>📝 Текст:</label>
                    <input type="text" id="gradientText" value="Catminefy" class="text-input" spellcheck="false">
                </div>

                <!-- Формат вывода -->
                <div class="control-group">
                    <label>📋 Формат вывода:</label>
                    <select id="formatSelect">
                        <option value="hex">&#xRRGGBB (HEX)</option>
                        <option value="legacy-hex">§x§R§R§G§G§B§B (Legacy HEX)</option>
                        <option value="tagged" selected>&lt;#RRGGBB&gt;текст&lt;/#RRGGBB&gt;</option>
                        <option value="mccode">§code (стандартный)</option>
                        <option value="ampersand">&amp;code (альтернативный)</option>
                        <option value="minimessage">&lt;gradient&gt; (MiniMessage)</option>
                    </select>
                </div>

                <!-- Список цветов -->
                <div class="color-list" id="colorList">
                    <!-- Цвета будут добавляться сюда -->
                </div>

                <!-- Кнопки управления цветами -->
                <div class="color-actions">
                    <button class="btn" id="addColor"><span class="ans-icon"><span style="color: var(--green);">＋ Добавить цвет</span></span></button>
                    <button class="btn" id="removeColor"><span class="ans-icon"><span style="color: var(--red);">✘ Удалить последний</span></span></button>
                    <button class="btn" id="clearColors"><span class="ans-icon"><span style="color: var(--red);">☠ Очистить всё</span></span></button>
                    <button class="btn" id="randomColors"><span class="ans-icon"><span style="color: var(--yellow);">✎ Случайные</span></span></button>
                </div>

                <!-- Превью -->
                <div class="gradient-preview">
                    <span id="previewText">Catminefy</span>
                </div>

                <!-- Результат -->
                <div class="gradient-result">
                    <h4>Готовый код:</h4>
                    <div class="code-block" data-lang="txt">
                        <div class="code-header">
                            <span class="code-lang">Minecraft</span>
                            <button class="copy-btn" data-target="mcOutput">Копировать</button>
                        </div>
                        <div class="code-content">
                            <pre><code id="mcOutput">§cCatminefy</code></pre>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <script src="../assets/js/gradient.js"></script>
        <script src="../assets/js/copy.js"></script>
        <script src="../assets/js/lang.js"></script>
        <script src="../assets/js/theme.js"></script>
        <script src="../assets/js/notifications.js"></script>
        <script src="../assets/js/scroll.js"></script>
        <script src="../assets/js/loader.js"></script>
        <script src="../assets/js/footer.js"></script>
        <script src="../assets/js/menu.js"></script>
    </body>
</html>
